name: Accept runtime

on:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - build.sh
      - versions.env
      - requirements.in
      - requirements.lock
      - payload/**
      - scripts/**
      - templates/**
      - tests/**
      - vendor/**
      - .github/workflows/accept-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accept-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Full Linux x86-64 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact source under acceptance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Record exact source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 --first-parent "$sha")"
          distance="$(git rev-list --count --first-parent "${base_tag}..${sha}")"
          if [[ "$distance" == 0 ]]; then
            description="$base_tag"
          else
            description="${base_tag}-${distance}-g${sha:0:12}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "distance=$distance" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Compute builder download cache key
        id: download-cache
        run: echo "key=$(./scripts/download-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore builder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .download-cache
          key: erpi-agent-env-linux-x64-${{ steps.download-cache.outputs.key }}
          restore-keys: |
            erpi-agent-env-linux-x64-

      - name: Run source validation
        run: ./tests/static-check.sh

      - name: Build and accept runtime
        env:
          ERPI_AGENT_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          ERPI_AGENT_SOURCE_BASE_TAG: ${{ steps.source.outputs.base_tag }}
          ERPI_AGENT_SOURCE_DISTANCE: ${{ steps.source.outputs.distance }}
          ERPI_AGENT_SOURCE_DESCRIPTION: ${{ steps.source.outputs.description }}
        run: ./build.sh

      - name: Write acceptance metadata
        shell: bash
        env:
          ACCEPTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          sidecar="$(printf '%s\n' dist/*.tar.gz.sha256)"
          python3 scripts/write-acceptance-metadata.py \
            --sidecar "$sidecar" \
            --output dist/acceptance.json \
            --source-sha "$ACCEPTED_SOURCE_SHA" \
            --source-base-tag "${{ steps.source.outputs.base_tag }}" \
            --source-distance "${{ steps.source.outputs.distance }}" \
            --source-description "${{ steps.source.outputs.description }}" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"
          cat "$sidecar"
          {
            echo '```json'
            cat dist/acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ steps.source.outputs.sha }}
          path: |
            dist/acceptance.json
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
