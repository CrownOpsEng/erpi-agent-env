name: Accept runtime

on:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - build.sh
      - versions.env
      - requirements.in
      - requirements.lock
      - scripts/**
      - templates/**
      - tests/**
      - .github/workflows/accept-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accept-runtime-main
  cancel-in-progress: true

jobs:
  acceptance:
    name: Full Linux x86-64 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore builder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .download-cache
          key: magnet-agent-env-linux-x64-${{ hashFiles('versions.env', 'requirements.lock') }}
          restore-keys: |
            magnet-agent-env-linux-x64-

      - name: Run source validation
        run: ./tests/static-check.sh

      - name: Build and accept runtime
        run: ./build.sh

      - name: Write acceptance metadata
        shell: bash
        run: |
          set -euo pipefail
          sidecar="$(printf '%s\n' dist/*.tar.gz.sha256)"
          python3 scripts/write-acceptance-metadata.py \
            --sidecar "$sidecar" \
            --output dist/acceptance.json \
            --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"
          cat "$sidecar"
          {
            echo '```json'
            cat dist/acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ github.sha }}
          path: |
            dist/acceptance.json
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
