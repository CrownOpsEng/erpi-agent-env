name: Accept runtime

on:
  push:
    branches: [main]
    paths:
      - build.sh
      - versions.env
      - requirements.in
      - requirements.lock
      - scripts/**
      - templates/**
      - tests/**
      - .github/workflows/accept-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accept-runtime-main
  cancel-in-progress: true

jobs:
  acceptance:
    name: Full Linux x86-64 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore builder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .download-cache
          key: magnet-agent-env-linux-x64-${{ hashFiles('versions.env', 'requirements.lock') }}
          restore-keys: |
            magnet-agent-env-linux-x64-

      - name: Run source validation
        run: ./tests/static-check.sh

      - name: Build and accept runtime
        run: ./build.sh

      - name: Record accepted artifact digest
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
