name: Qualify Supabase CLI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-supabase-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Linux x86-64 release payload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Qualify official Supabase CLI 2.114.0 archive
        shell: bash
        run: |
          set -euo pipefail
          version=2.114.0
          asset="supabase_${version}_linux_amd64.tar.gz"
          base="https://github.com/supabase/cli/releases/download/v${version}"
          work="$RUNNER_TEMP/supabase-cli-qualification"
          extract="$work/extracted"
          relocated="$work/Relocated – spaces and unicode/deep/path/bin"
          probe="$work/project probe"
          report="$work/report.txt"
          mkdir -p "$extract" "$relocated" "$probe"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
            -o "$work/checksums.txt" "$base/checksums.txt"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
            -o "$work/$asset" "$base/$asset"

          expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset {print $1}' "$work/checksums.txt")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Could not resolve official checksum for $asset" >&2
            cat "$work/checksums.txt" >&2
            exit 1
          }
          actual="$(sha256sum "$work/$asset" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "Supabase CLI archive checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }

          tar -xzf "$work/$asset" -C "$extract"
          mapfile -t files < <(find "$extract" -maxdepth 2 -type f -printf '%P\n' | LC_ALL=C sort)
          printf 'archive_sha256=%s\narchive_bytes=%s\n' "$actual" "$(stat -c '%s' "$work/$asset")" | tee "$report"
          printf 'archive_files:\n' | tee -a "$report"
          printf '  %s\n' "${files[@]}" | tee -a "$report"

          [[ -x "$extract/supabase" ]] || { echo 'Archive is missing executable supabase' >&2; exit 1; }
          [[ -x "$extract/supabase-go" ]] || { echo 'Archive is missing executable supabase-go' >&2; exit 1; }

          for binary in supabase supabase-go; do
            path="$extract/$binary"
            {
              printf '%s_sha256=%s\n' "$binary" "$(sha256sum "$path" | awk '{print $1}')"
              printf '%s_bytes=%s\n' "$binary" "$(stat -c '%s' "$path")"
              printf '%s_file=' "$binary"
              file -b "$path"
              printf '%s_ldd:\n' "$binary"
              ldd "$path" 2>&1 || true
              printf '%s_glibc_symbols:\n' "$binary"
              readelf --version-info "$path" 2>/dev/null | grep -oE 'GLIBC_[0-9]+([.][0-9]+)+' | sort -Vu | tail -20 || true
            } | tee -a "$report"
          done

          version_out="$($extract/supabase --version)"
          printf 'supabase_version=%s\n' "$version_out" | tee -a "$report"
          grep -F "$version" <<<"$version_out" >/dev/null

          cp "$extract/supabase" "$relocated/supabase"
          cp "$extract/supabase-go" "$relocated/supabase-go"
          chmod 0755 "$relocated/supabase" "$relocated/supabase-go"

          export HOME="$work/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID SUPABASE_PROJECT_REF || true

          "$relocated/supabase" --help >/dev/null
          "$relocated/supabase" db diff --help >/dev/null
          "$relocated/supabase" migration squash --help >/dev/null

          cd "$probe"
          "$relocated/supabase" init --yes
          test -f supabase/config.toml
          "$relocated/supabase" migration new portable_probe
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*_portable_probe.sql' -print)
          [[ ${#migrations[@]} -eq 1 ]] || {
            echo "Expected exactly one portable_probe migration; found ${#migrations[@]}" >&2
            find supabase -maxdepth 3 -print >&2 || true
            exit 1
          }
          printf 'migration_file=%s\n' "${migrations[0]}" | tee -a "$report"

          {
            echo '### Supabase CLI 2.114.0 qualification'
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
