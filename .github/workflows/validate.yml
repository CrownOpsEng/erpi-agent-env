name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    name: Builder source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check direct-to-main commit message
        if: github.event_name == 'push'
        run: git log -1 --format=%B | python3 scripts/check-commit-message.py

      - name: Run builder static checks
        run: |
          ./tests/static-check.sh
          ./tests/commit-message-check.sh
          ./tests/release-workflow-check.sh
