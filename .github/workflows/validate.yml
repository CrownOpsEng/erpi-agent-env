name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    name: Builder source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check introduced commit history
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/check-commit-range.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Run builder static checks
        run: |
          ./tests/static-check.sh
          ./tests/commit-message-check.sh
          ./tests/commit-range-check.sh
          ./tests/release-workflow-check.sh
