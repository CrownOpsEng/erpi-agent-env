name: tmp-v0.2.0 capability qualification

on:
  push:
    branches:
      - agent/v020-database-capabilities
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify database and offline-tool candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Qualify candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v020-qualification"
          REPORT="$ROOT/report.txt"
          mkdir -p "$ROOT"
          exec > >(tee "$REPORT") 2>&1

          section() { printf '\n===== %s =====\n' "$*"; }
          sha() { sha256sum "$1" | awk '{print $1}'; }
          gh_asset_url() {
            local repo="$1" tag="$2" asset="$3"
            gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .browser_download_url"
          }
          max_glibc() {
            local root="$1"
            find "$root" -type f -print0 | while IFS= read -r -d '' f; do
              if file "$f" 2>/dev/null | grep -q 'ELF'; then
                readelf --version-info "$f" 2>/dev/null || true
              fi
            done | grep -oE 'GLIBC_[0-9]+([.][0-9]+)+' | sort -Vu | tail -1 || true
          }

          section "Theseus PostgreSQL 17.10.0"
          PG_ASSET='postgresql-17.10.0-x86_64-unknown-linux-gnu.tar.gz'
          PG_URL="$(gh_asset_url theseus-rs/postgresql-binaries 17.10.0 "$PG_ASSET")"
          test -n "$PG_URL"
          curl -fL --retry 3 -o "$ROOT/$PG_ASSET" "$PG_URL"
          echo "THESEUS_POSTGRES_URL=$PG_URL"
          echo "THESEUS_POSTGRES_SHA256=$(sha "$ROOT/$PG_ASSET")"
          mkdir -p "$ROOT/pg"
          tar -xzf "$ROOT/$PG_ASSET" -C "$ROOT/pg"
          PGROOT="$(find "$ROOT/pg" -type f -path '*/bin/postgres' -printf '%h\n' -quit | xargs dirname)"
          test -x "$PGROOT/bin/postgres"
          echo "PGROOT=$PGROOT"
          echo "THESEUS_MAX_GLIBC=$(max_glibc "$PGROOT")"
          for tool in postgres initdb pg_ctl pg_isready psql createdb dropdb pgbench pg_dump pg_restore pg_dumpall pg_amcheck pg_checksums pg_config; do
            if [[ -x "$PGROOT/bin/$tool" ]]; then
              printf 'PG_TOOL_%s=present\n' "$tool"
            else
              printf 'PG_TOOL_%s=missing\n' "$tool"
            fi
          done
          "$PGROOT/bin/postgres" --version
          "$PGROOT/bin/psql" --version
          "$PGROOT/bin/pgbench" --version
          "$PGROOT/bin/pg_dump" --version
          "$PGROOT/bin/pg_amcheck" --version
          "$PGROOT/bin/pg_config" --version
          "$PGROOT/bin/pg_config" --configure
          test -d "$($PGROOT/bin/pg_config --includedir-server)" && echo PG_SERVER_HEADERS=present || echo PG_SERVER_HEADERS=missing
          test -f "$($PGROOT/bin/pg_config --pgxs)" && echo PG_PGXS=present || echo PG_PGXS=missing

          section "PostgreSQL relocation, integrity, recovery, concurrency and diagnostics"
          MOVED="$ROOT/Relocated PostgreSQL – spaces unicode/deep/path/postgresql"
          mkdir -p "$(dirname "$MOVED")"
          cp -a "$PGROOT" "$MOVED"
          PG="$MOVED"
          export PATH="$PG/bin:$PATH"
          export LD_LIBRARY_PATH="$PG/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          DATA="$ROOT/data"
          SOCKET="$ROOT/socket"
          mkdir -p "$SOCKET"
          initdb -D "$DATA" --encoding=UTF8 --locale-provider=icu --icu-locale=en-US --data-checksums --auth=trust >/dev/null
          cat >> "$DATA/postgresql.conf" <<CONF
          listen_addresses = '127.0.0.1'
          port = 55432
          unix_socket_directories = '$SOCKET'
          timezone = 'UTC'
          jit = off
          compute_query_id = auto
          max_connections = 60
          shared_preload_libraries = 'pg_stat_statements'
          CONF
          pg_ctl -D "$DATA" -l "$ROOT/postgres.log" -w start
          trap 'pg_ctl -D "$DATA" -m fast -w stop >/dev/null 2>&1 || true' EXIT
          export PGHOST=127.0.0.1 PGPORT=55432 PGUSER="$USER" PGDATABASE=postgres
          pg_isready
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pg_stat_statements;
          create extension if not exists amcheck;
          create table q(id bigint primary key, value bigint not null default 0);
          insert into q(id) values (1);
          begin;
          update q set value = value + 1 where id = 1;
          rollback;
          select value from q where id = 1;
          select extname from pg_extension where extname in ('pg_stat_statements','amcheck') order by 1;
          load 'auto_explain';
          SQL
          createdb bench
          pgbench -i -s 1 bench >/dev/null
          pgbench -c 4 -j 2 -T 2 -n bench | tee "$ROOT/pgbench.txt"
          pg_dump -Fc postgres -f "$ROOT/postgres.dump"
          createdb restorecheck
          pg_restore --exit-on-error -d restorecheck "$ROOT/postgres.dump"
          pg_amcheck --database=restorecheck --all-indexes --heapallindexed
          psql -Atc "select calls > 0 from pg_stat_statements where query like '%select value from q%' limit 1" | grep -Fx true
          pg_ctl -D "$DATA" -m fast -w stop
          trap - EXIT
          pg_checksums --check -D "$DATA"
          echo POSTGRES_RUNTIME_GATE=pass

          section "pgTAP 1.3.3"
          curl -fL --retry 3 -o "$ROOT/pgtap-1.3.3.tar.gz" https://github.com/theory/pgtap/archive/refs/tags/v1.3.3.tar.gz
          echo "PGTAP_SHA256=$(sha "$ROOT/pgtap-1.3.3.tar.gz")"
          tar -xzf "$ROOT/pgtap-1.3.3.tar.gz" -C "$ROOT"
          PGTAP_SRC="$ROOT/pgtap-1.3.3"
          make -C "$PGTAP_SRC" >/dev/null
          find "$PGTAP_SRC" -maxdepth 1 -type f -name 'pgtap--*.sql' -print
          echo PGTAP_BUILD=pass

          section "plpgsql_check 2.8.11"
          curl -fL --retry 3 -o "$ROOT/plpgsql-check-2.8.11.tar.gz" https://github.com/okbob/plpgsql_check/archive/refs/tags/v2.8.11.tar.gz
          echo "PLPGSQL_CHECK_SHA256=$(sha "$ROOT/plpgsql-check-2.8.11.tar.gz")"
          tar -xzf "$ROOT/plpgsql-check-2.8.11.tar.gz" -C "$ROOT"
          PLC_SRC="$ROOT/plpgsql_check-2.8.11"
          make -C "$PLC_SRC" USE_PGXS=1 PG_CONFIG="$PG/bin/pg_config"
          test -f "$PLC_SRC/plpgsql_check.so"
          echo "PLPGSQL_CHECK_MAX_GLIBC=$(max_glibc "$PLC_SRC/plpgsql_check.so")"
          ldd "$PLC_SRC/plpgsql_check.so" || true
          cp "$PLC_SRC/plpgsql_check.so" "$PG/lib/"
          cp "$PLC_SRC/plpgsql_check.control" "$PG/share/extension/"
          cp "$PLC_SRC"/plpgsql_check--*.sql "$PG/share/extension/"
          DATA2="$ROOT/data-plcheck"
          SOCKET2="$ROOT/socket-plcheck"
          mkdir -p "$SOCKET2"
          initdb -D "$DATA2" --encoding=UTF8 --locale-provider=icu --icu-locale=en-US --data-checksums --auth=trust >/dev/null
          cat >> "$DATA2/postgresql.conf" <<CONF
          listen_addresses = '127.0.0.1'
          port = 55433
          unix_socket_directories = '$SOCKET2'
          timezone = 'UTC'
          CONF
          pg_ctl -D "$DATA2" -l "$ROOT/postgres-plcheck.log" -w start
          trap 'pg_ctl -D "$DATA2" -m fast -w stop >/dev/null 2>&1 || true' EXIT
          export PGPORT=55433
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension plpgsql_check;
          create table t_ok(id integer primary key);
          create function f_ok(p integer) returns integer language plpgsql as $$ begin return p + 1; end $$;
          select count(*) = 0 from plpgsql_check_function_tb('f_ok(integer)'::regprocedure) where level in ('error','warning');
          create function f_bad() returns integer language plpgsql as $$ declare x integer; begin x := 'bad'::text; return x; end $$;
          SQL
          set +e
          BAD_OUT="$(psql -At -c "select level || ':' || message from plpgsql_check_function_tb('f_bad()'::regprocedure)" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$BAD_OUT"
          test "$rc" -eq 0
          test -n "$BAD_OUT"
          pg_ctl -D "$DATA2" -m fast -w stop
          trap - EXIT
          pg_checksums --check -D "$DATA2"
          echo PLPGSQL_CHECK_GATE=pass

          section "ShellCheck 0.11.0"
          SC_ASSET='shellcheck-v0.11.0.linux.x86_64.tar.xz'
          SC_URL="$(gh_asset_url koalaman/shellcheck v0.11.0 "$SC_ASSET")"
          curl -fL --retry 3 -o "$ROOT/$SC_ASSET" "$SC_URL"
          echo "SHELLCHECK_URL=$SC_URL"
          echo "SHELLCHECK_SHA256=$(sha "$ROOT/$SC_ASSET")"
          mkdir -p "$ROOT/sc" && tar -xJf "$ROOT/$SC_ASSET" -C "$ROOT/sc"
          SC_BIN="$(find "$ROOT/sc" -type f -name shellcheck -print -quit)"
          "$SC_BIN" --version
          printf '#!/bin/sh\necho "$x"\n' > "$ROOT/good.sh"
          "$SC_BIN" "$ROOT/good.sh"
          printf '#!/bin/sh\nfor f in $(ls); do echo $f; done\n' > "$ROOT/bad.sh"
          if "$SC_BIN" "$ROOT/bad.sh" >/dev/null 2>&1; then echo 'ShellCheck failed to reject known-bad script' >&2; exit 1; fi
          echo SHELLCHECK_GATE=pass

          section "Miller 6.20.2"
          ML_TAG='v6.20.2'
          ML_ASSET="$(gh api repos/johnkerl/miller/releases/tags/$ML_TAG --jq '.assets[].name' | grep -E '^miller-6[.]20[.]2-linux-(amd64|x86_64)[.]tar[.]gz$' | sed -n '1p')"
          test -n "$ML_ASSET"
          ML_URL="$(gh_asset_url johnkerl/miller "$ML_TAG" "$ML_ASSET")"
          curl -fL --retry 3 -o "$ROOT/$ML_ASSET" "$ML_URL"
          echo "MILLER_ASSET=$ML_ASSET"
          echo "MILLER_URL=$ML_URL"
          echo "MILLER_SHA256=$(sha "$ROOT/$ML_ASSET")"
          mkdir -p "$ROOT/mlr" && tar -xzf "$ROOT/$ML_ASSET" -C "$ROOT/mlr"
          MLR_BIN="$(find "$ROOT/mlr" -type f -name mlr -print -quit)"
          "$MLR_BIN" --version
          printf 'id,value\n1,2\n2,5\n' | "$MLR_BIN" --icsv --ojson filter '$value > 2' then put '$double=$value*2' > "$ROOT/mlr.json"
          grep -q '"double": 10' "$ROOT/mlr.json"
          echo MILLER_GATE=pass

          section "NPM capsule candidates"
          CAPS="$ROOT/capsules"
          mkdir -p "$CAPS"
          cd "$CAPS"
          for spec in 'postgres@3.4.7' '@postgres-language-server/wasm@0.25.7' 'fast-check@4.9.0' '@supabase/pg-delta@1.0.0-alpha.33'; do
            safe="$(printf '%s' "$spec" | tr '/@' '__')"
            echo "--- $spec ---"
            npm view "$spec" name version dist.tarball dist.integrity dependencies --json
            npm pack "$spec" --ignore-scripts --json > "$safe.pack.json"
            tgz="$(node -e "const x=require('./$safe.pack.json');process.stdout.write(x[0].filename)")"
            echo "NPM_SPEC=$spec FILE=$tgz SHA256=$(sha "$tgz")"
          done
          PURE_VERSION="$(node - <<'NODE'
          const p=require('./fast-check_4.9.0.pack.json')[0].filename;
          const {execFileSync}=require('child_process');
          const fs=require('fs'), os=require('os'), path=require('path');
          const d=fs.mkdtempSync(path.join(os.tmpdir(),'fc-'));
          execFileSync('tar',['-xzf',p,'-C',d]);
          const pkg=JSON.parse(fs.readFileSync(path.join(d,'package','package.json')));
          process.stdout.write(pkg.dependencies['pure-rand']);
          NODE
          )"
          echo "FAST_CHECK_PURE_RAND_RANGE=$PURE_VERSION"
          PURE_EXACT="$(npm view "pure-rand@$PURE_VERSION" version)"
          npm view "pure-rand@$PURE_EXACT" name version dist.tarball dist.integrity dependencies --json
          npm pack "pure-rand@$PURE_EXACT" --ignore-scripts --json > pure-rand.pack.json
          PURE_TGZ="$(node -e "const x=require('./pure-rand.pack.json');process.stdout.write(x[0].filename)")"
          echo "NPM_SPEC=pure-rand@$PURE_EXACT FILE=$PURE_TGZ SHA256=$(sha "$PURE_TGZ")"

          section "Fast-check deterministic model/shrink smoke"
          mkdir -p "$ROOT/fc-test"
          cd "$ROOT/fc-test"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$CAPS"/fast-check-4.9.0.tgz "$CAPS"/"$PURE_TGZ" >/dev/null
          node --input-type=module <<'NODE'
          import fc from 'fast-check';
          const seed=424242;
          let saw=false;
          try {
            fc.assert(fc.property(fc.integer({min:0,max:100}), n => n < 10), {seed,numRuns:100});
          } catch (e) {
            saw=true;
            if (!String(e).includes('Counterexample')) throw e;
          }
          if (!saw) throw new Error('known failing property unexpectedly passed');
          const a=fc.sample(fc.array(fc.integer(), {maxLength:8}), {seed,numRuns:5});
          const b=fc.sample(fc.array(fc.integer(), {maxLength:8}), {seed,numRuns:5});
          if (JSON.stringify(a)!==JSON.stringify(b)) throw new Error('seed replay was not deterministic');
          console.log('fast-check deterministic replay and shrink smoke passed');
          NODE
          echo FAST_CHECK_GATE=pass

          section "pg-delta Node viability"
          mkdir -p "$ROOT/pgdelta-test"
          cd "$ROOT/pgdelta-test"
          npm init -y >/dev/null
          PGDELTA_TGZ="$(node -e "const x=require('$CAPS/_supabase_pg-delta_1.0.0-alpha.33.pack.json');process.stdout.write(x[0].filename)")"
          npm install --ignore-scripts --no-audit --no-fund "$CAPS/$PGDELTA_TGZ" >/dev/null
          node --input-type=module <<'NODE'
          import * as pgd from '@supabase/pg-delta';
          console.log('PGDELTA_EXPORTS='+Object.keys(pgd).sort().join(','));
          for (const k of ['createPlan','renderPlanFiles']) if (typeof pgd[k] !== 'function') throw new Error(`missing ${k}`);
          NODE
          echo PGDELTA_NODE_IMPORT=pass

          section "Candidate Python lock"
          cd "$GITHUB_WORKSPACE"
          UV_AR="$ROOT/uv.tar.gz"
          curl -fL --retry 3 -o "$UV_AR" "https://releases.astral.sh/github/uv/releases/download/0.12.5/uv-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$ROOT/uv" && tar -xzf "$UV_AR" -C "$ROOT/uv"
          UV_BIN="$(find "$ROOT/uv" -type f -name uv -print -quit)"
          cat > "$ROOT/requirements.in" <<'REQ'
          httpx[cli]==0.28.1
          jsonschema==4.26.0
          packaging==26.2
          PyYAML==6.0.3
          tomlkit==0.15.1
          pip==26.1.2
          REQ
          "$UV_BIN" pip compile --generate-hashes --no-header --no-annotate "$ROOT/requirements.in" -o "$ROOT/requirements.lock"
          echo "PYTHON_LOCK_SHA256=$(sha "$ROOT/requirements.lock")"
          cat "$ROOT/requirements.lock"

          section "Qualification complete"
          echo QUALIFICATION=pass

      - name: Collect qualification outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v020-qualification"
          mkdir -p "$ROOT/out"
          cp -f "$ROOT/report.txt" "$ROOT/out/" 2>/dev/null || true
          cp -f "$ROOT/requirements.in" "$ROOT/out/" 2>/dev/null || true
          cp -f "$ROOT/requirements.lock" "$ROOT/out/" 2>/dev/null || true
          find "$ROOT/capsules" -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.pack.json' \) -exec cp -f {} "$ROOT/out/" \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v020-qualification
          path: ${{ runner.temp }}/v020-qualification/out
          if-no-files-found: warn
          retention-days: 7
