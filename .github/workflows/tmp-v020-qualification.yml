name: tmp-v0.2.0 database qualification

on:
  push:
    branches:
      - agent/v020-database-capabilities
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify portable PostgreSQL database capability
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and qualify database capability
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v020-database-qualification"
          REPORT="$ROOT/report.txt"
          mkdir -p "$ROOT"
          exec > >(tee "$REPORT") 2>&1

          sha() { sha256sum "$1" | awk '{print $1}'; }
          max_glibc() {
            local root="$1"
            find "$root" -type f -print0 | while IFS= read -r -d '' file; do
              if file "$file" 2>/dev/null | grep -q 'ELF'; then
                readelf --version-info "$file" 2>/dev/null || true
              fi
            done | grep -oE 'GLIBC_[0-9]+([.][0-9]+)+' | sort -Vu | tail -1
          }
          require_glibc_228_or_lower() {
            local root="$1" observed
            observed="$(max_glibc "$root")"
            printf 'MAX_GLIBC[%s]=%s\n' "$root" "$observed"
            python3 - "$observed" <<'PY'
          import re, sys
          match = re.fullmatch(r"GLIBC_(\d+)\.(\d+)", sys.argv[1])
          if not match:
              raise SystemExit(f"unparseable glibc symbol: {sys.argv[1]}")
          if tuple(map(int, match.groups())) > (2, 28):
              raise SystemExit(f"glibc floor exceeded: {sys.argv[1]} > GLIBC_2.28")
          PY
          }

          echo '===== Verified sources ====='
          PG_SOURCE_URL='https://ftp.postgresql.org/pub/source/v17.10/postgresql-17.10.tar.bz2'
          PG_SOURCE_SHA256='078a03516dcdbdb705fecaf415ea3d13a956c589e46f09fed68a06fb00598c90'
          PLPGSQL_CHECK_URL='https://github.com/okbob/plpgsql_check/archive/refs/tags/v2.8.11.tar.gz'
          PLPGSQL_CHECK_SHA256='de01ebd2e87a064418c453a74dafb43c2d41acbecdfd80c78cb5b6a95b834d27'
          PGTAP_URL='https://github.com/theory/pgtap/archive/refs/tags/v1.3.3.tar.gz'
          PGTAP_SHA256='325ea79d0d2515bce96bce43f6823dcd3effbd6c54cb2a4d6c2384fffa3a14c7'
          ZONKY_URL='https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-linux-amd64/17.10.0/embedded-postgres-binaries-linux-amd64-17.10.0.jar'
          ZONKY_SHA256='a6c44794a7a258621b8cb98c196bf621cdd705d9fa73c3628166b658c419877a'
          ZONKY_TXZ_SHA256='98649a7d5402ad699e7d8061a955e376dc02eed5b28d149e20ac596c5f5cba0d'

          curl -fL --retry 3 -o "$ROOT/postgresql-17.10.tar.bz2" "$PG_SOURCE_URL"
          test "$(sha "$ROOT/postgresql-17.10.tar.bz2")" = "$PG_SOURCE_SHA256"
          curl -fL --retry 3 -o "$ROOT/plpgsql-check-2.8.11.tar.gz" "$PLPGSQL_CHECK_URL"
          test "$(sha "$ROOT/plpgsql-check-2.8.11.tar.gz")" = "$PLPGSQL_CHECK_SHA256"
          curl -fL --retry 3 -o "$ROOT/pgtap-1.3.3.tar.gz" "$PGTAP_URL"
          test "$(sha "$ROOT/pgtap-1.3.3.tar.gz")" = "$PGTAP_SHA256"
          curl -fL --retry 3 -o "$ROOT/zonky.jar" "$ZONKY_URL"
          test "$(sha "$ROOT/zonky.jar")" = "$ZONKY_SHA256"

          tar -xjf "$ROOT/postgresql-17.10.tar.bz2" -C "$ROOT"
          tar -xzf "$ROOT/plpgsql-check-2.8.11.tar.gz" -C "$ROOT"
          tar -xzf "$ROOT/pgtap-1.3.3.tar.gz" -C "$ROOT"

          echo '===== Controlled GLIBC 2.28 build ====='
          MANYLINUX_IMAGE='quay.io/pypa/manylinux_2_28_x86_64:latest'
          docker pull "$MANYLINUX_IMAGE" >/dev/null
          MANYLINUX_DIGEST="$(docker image inspect "$MANYLINUX_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$MANYLINUX_DIGEST"
          printf 'MANYLINUX_IMAGE=%s\n' "$MANYLINUX_DIGEST"

          docker run --rm -v "$ROOT:/work" "$MANYLINUX_DIGEST" bash -lc '
            set -euo pipefail
            dnf -y install flex >/dev/null
            cd /work/postgresql-17.10
            ./configure --prefix=/opt/pgbuild --without-readline --without-zlib --without-icu
            make -j2
            make DESTDIR=/work/pg-stage install
            rm -rf /opt/pgbuild
            cp -a /work/pg-stage/opt/pgbuild /opt/pgbuild
            cd /work/plpgsql_check-2.8.11
            make clean >/dev/null 2>&1 || true
            make -j2 USE_PGXS=1 PG_CONFIG=/opt/pgbuild/bin/pg_config
            make USE_PGXS=1 PG_CONFIG=/opt/pgbuild/bin/pg_config DESTDIR=/work/plcheck-stage install
          '

          STAGE="$ROOT/pg-stage/opt/pgbuild"
          for tool in psql pg_isready createdb dropdb pgbench pg_dump pg_restore pg_dumpall pg_amcheck pg_checksums; do
            test -x "$STAGE/bin/$tool"
          done
          test -x "$STAGE/bin/pg_config"
          PLPGSQL_SO="$(find "$ROOT/plcheck-stage" -type f -name plpgsql_check.so -print -quit)"
          test -f "$PLPGSQL_SO"

          echo '===== Minimal portable client payload ====='
          mkdir -p "$ROOT/client-payload/bin" "$ROOT/client-payload/lib"
          for tool in psql pg_isready createdb dropdb pgbench pg_dump pg_restore pg_dumpall pg_amcheck pg_checksums; do
            install -m 0755 "$STAGE/bin/$tool" "$ROOT/client-payload/bin/$tool"
          done
          cp -a "$STAGE/lib/libpq.so"* "$ROOT/client-payload/lib/"
          require_glibc_228_or_lower "$ROOT/client-payload"

          mkdir -p "$ROOT/plcheck-payload"
          install -m 0755 "$PLPGSQL_SO" "$ROOT/plcheck-payload/plpgsql_check.so"
          install -m 0644 "$ROOT/plpgsql_check-2.8.11/plpgsql_check.control" "$ROOT/plcheck-payload/plpgsql_check.control"
          cp "$ROOT/plpgsql_check-2.8.11"/plpgsql_check--*.sql "$ROOT/plcheck-payload/"
          chmod 0644 "$ROOT/plcheck-payload"/*.sql
          require_glibc_228_or_lower "$ROOT/plcheck-payload"

          tar --sort=name --mtime='UTC 2026-08-20' --owner=0 --group=0 --numeric-owner -czf "$ROOT/postgresql-client-17.10-linux-x64-gnu.tar.gz" -C "$ROOT" client-payload
          tar --sort=name --mtime='UTC 2026-08-20' --owner=0 --group=0 --numeric-owner -czf "$ROOT/plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz" -C "$ROOT" plcheck-payload
          printf 'POSTGRES_CLIENT_PAYLOAD_SHA256=%s\n' "$(sha "$ROOT/postgresql-client-17.10-linux-x64-gnu.tar.gz")"
          printf 'PLPGSQL_CHECK_PAYLOAD_SHA256=%s\n' "$(sha "$ROOT/plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz")"

          echo '===== Zonky server extraction ====='
          mkdir -p "$ROOT/zonky-jar" "$ROOT/server"
          unzip -q "$ROOT/zonky.jar" -d "$ROOT/zonky-jar"
          ZONKY_TXZ="$(find "$ROOT/zonky-jar" -type f -name '*.txz' -print -quit)"
          test -f "$ZONKY_TXZ"
          test "$(sha "$ZONKY_TXZ")" = "$ZONKY_TXZ_SHA256"
          tar -xJf "$ZONKY_TXZ" -C "$ROOT/server"
          test -x "$ROOT/server/bin/postgres"
          test -x "$ROOT/server/bin/initdb"
          test -x "$ROOT/server/bin/pg_ctl"
          require_glibc_228_or_lower "$ROOT/server"

          echo '===== pgTAP generated extension ====='
          make -C "$ROOT/pgtap-1.3.3" >/dev/null
          test -f "$ROOT/pgtap-1.3.3/sql/pgtap--1.3.3.sql"
          PGTAP_SHARE="$ROOT/server/share/postgresql/extension"
          install -m 0644 "$ROOT/pgtap-1.3.3/pgtap.control" "$PGTAP_SHARE/pgtap.control"
          install -m 0644 "$ROOT/pgtap-1.3.3/sql/pgtap--1.3.3.sql" "$PGTAP_SHARE/pgtap--1.3.3.sql"

          echo '===== plpgsql_check installed into qualified server ====='
          install -m 0644 "$ROOT/plcheck-payload/plpgsql_check.control" "$PGTAP_SHARE/plpgsql_check.control"
          cp "$ROOT/plcheck-payload"/plpgsql_check--*.sql "$PGTAP_SHARE/"
          PKGLIB="$(find "$ROOT/server/lib" -type f -name auto_explain.so -printf '%h\n' -quit)"
          test -d "$PKGLIB"
          install -m 0755 "$ROOT/plcheck-payload/plpgsql_check.so" "$PKGLIB/plpgsql_check.so"

          echo '===== Hostile relocation and runtime proof ====='
          MOVED="$ROOT/Relocated PostgreSQL – spaces unicode/deep/path/runtime"
          mkdir -p "$MOVED/server" "$MOVED/client"
          cp -a "$ROOT/server"/. "$MOVED/server/"
          cp -a "$ROOT/client-payload"/. "$MOVED/client/"
          export LD_LIBRARY_PATH="$MOVED/client/lib"
          export PGHOST=127.0.0.1
          export PGPORT=55432
          export PGUSER=postgres
          export PGDATABASE=postgres

          DATA="$ROOT/data"
          SOCKET="$ROOT/socket"
          mkdir -p "$SOCKET"
          "$MOVED/server/bin/initdb" -D "$DATA" --username=postgres --encoding=UTF8 --locale-provider=icu --icu-locale=en-US --locale=C.UTF-8 --data-checksums --auth=trust >/dev/null
          cat >> "$DATA/postgresql.conf" <<CONF
          listen_addresses = '127.0.0.1'
          port = 55432
          unix_socket_directories = '$SOCKET'
          timezone = 'UTC'
          jit = off
          compute_query_id = auto
          max_connections = 60
          shared_preload_libraries = 'pg_stat_statements'
          CONF
          "$MOVED/server/bin/pg_ctl" -D "$DATA" -l "$ROOT/postgres.log" -w start
          cleanup() {
            "$MOVED/server/bin/pg_ctl" -D "$DATA" -m fast -w stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$MOVED/client/bin/pg_isready" | grep -F 'accepting connections'
          "$MOVED/client/bin/psql" -v ON_ERROR_STOP=1 <<'SQL'
          select current_setting('server_version') like '17.10%' as version_ok;
          select current_setting('server_encoding') = 'UTF8' as encoding_ok;
          select current_setting('TimeZone') = 'UTC' as timezone_ok;
          select current_setting('default_transaction_isolation') = 'read committed' as isolation_ok;
          select current_setting('data_checksums') = 'on' as checksums_ok;
          create extension pgtap;
          create extension plpgsql_check;
          create extension pg_stat_statements;
          create extension amcheck;
          create table q(id bigint primary key, value bigint not null default 0);
          insert into q(id) values (1);
          begin;
          update q set value = value + 1 where id = 1;
          rollback;
          select value = 0 as rollback_ok from q where id = 1;
          load 'auto_explain';
          select plan(2);
          select ok(true, 'known good assertion');
          select is(1, 1, 'known equality');
          select * from finish();
          create function f_ok(p integer) returns integer language plpgsql as $$ begin return p + 1; end $$;
          create function f_bad() returns integer language plpgsql as $$ declare x integer; begin select missing_column into x from pg_class limit 1; return x; end $$;
          SQL

          test "$("$MOVED/client/bin/psql" -Atc "select count(*) from plpgsql_check_function_tb('f_ok(integer)'::regprocedure) where level in ('error','warning')")" = 0
          BAD_DIAGNOSTIC="$("$MOVED/client/bin/psql" -Atc "select level || ':' || message from plpgsql_check_function_tb('f_bad()'::regprocedure)")"
          printf 'PLPGSQL_CHECK_BAD_DIAGNOSTIC=%s\n' "$BAD_DIAGNOSTIC"
          test -n "$BAD_DIAGNOSTIC"

          echo '===== Concurrent workload and statistics ====='
          "$MOVED/client/bin/createdb" bench
          "$MOVED/client/bin/pgbench" -i -s 1 bench >/dev/null
          "$MOVED/client/bin/pgbench" -c 4 -j 2 -T 2 -n bench | tee "$ROOT/pgbench.txt"
          grep -F 'failed transactions: 0' "$ROOT/pgbench.txt"
          "$MOVED/client/bin/psql" -Atc "select count(*) > 0 from pg_stat_statements where calls > 0" | grep -Fx t

          echo '===== Dump, restore, logical and physical integrity ====='
          "$MOVED/client/bin/pg_dump" -Fc postgres -f "$ROOT/postgres.dump"
          "$MOVED/client/bin/createdb" restorecheck
          "$MOVED/client/bin/pg_restore" --exit-on-error -d restorecheck "$ROOT/postgres.dump"
          PGDATABASE=restorecheck "$MOVED/client/bin/pg_amcheck" --heapallindexed --checkunique --parent-check --rootdescend
          PGDATABASE=restorecheck "$MOVED/client/bin/psql" -Atc 'select value from q where id=1' | grep -Fx 0

          "$MOVED/server/bin/pg_ctl" -D "$DATA" -m fast -w stop
          trap - EXIT
          "$MOVED/client/bin/pg_checksums" --check -D "$DATA"

          echo 'DATABASE_QUALIFICATION=pass'

      - name: Collect qualification outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v020-database-qualification"
          mkdir -p "$ROOT/out"
          for file in report.txt postgresql-client-17.10-linux-x64-gnu.tar.gz plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz; do
            cp -f "$ROOT/$file" "$ROOT/out/" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v020-database-qualification
          path: ${{ runner.temp }}/v020-database-qualification/out
          if-no-files-found: warn
          retention-days: 7
