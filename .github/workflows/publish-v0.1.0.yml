name: Publish v0.1.0 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Create v0.1.0 release
    runs-on: ubuntu-24.04
    steps:
      - name: Verify accepted target and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 0629a5a194dfe397833b302368cf6098848dca90
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to recreate it." >&2
            exit 1
          fi

          acceptance="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Accept runtime")][0] | [.status, .conclusion] | @tsv')"
          [[ "$acceptance" == $'completed\tsuccess' ]] || {
            echo "Target $TARGET_SHA does not have a completed successful Accept runtime run: $acceptance" >&2
            exit 1
          }

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes 'First pre-1.0 release of the Magnet Agent Environment. It packages the relocatable Linux x86-64 agent runtime, offline Python recovery, pinned native tooling, Git/GitHub capability routing, immutable verification, and CI acceptance/release automation developed through the initial portability hardening cycle. Version 0.1.0 intentionally signals that the compatibility contract is working and extensively tested but is still accumulating real-world usage evidence before a future 1.0.0.'
