name: tmp-export exact source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export exact branch source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$source_sha" == "$expected" ]]
          printf '%s\n' "$source_sha" > ../SOURCE_SHA
          tar --exclude=.git -czf ../magnet-photos-env-source.tar.gz .

      - name: Upload source handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ../SOURCE_SHA
            ../magnet-photos-env-source.tar.gz
          retention-days: 1
