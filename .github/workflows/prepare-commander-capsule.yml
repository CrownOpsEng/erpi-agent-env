name: Prepare Commander capsule update

on:
  push:
    branches:
      - fix/commander-node-capsule

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-commander-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-and-accept:
    if: github.ref == 'refs/heads/fix/commander-node-capsule'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/commander-node-capsule

      - name: Prepare exact Commander capsule source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/commander-15.0.0.tgz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors --connect-timeout 20 \
            -o "$archive" \
            'https://registry.npmjs.org/commander/-/commander-15.0.0.tgz'
          python3 scripts/prepare-commander-capsule.py "$archive"
          git diff --check
          git diff --stat

      - name: Run complete source test suite
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            GIT_CONFIG_GLOBAL=/dev/null "$test_script"
          done

      - name: Commit source-validated final state
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -F - <<'EOF'
          fix(node-capsules): hydrate Commander for repository CLIs

          Why:
          ERPI now uses commander 15.0.0 in its repository-owned CLI. The released agent environment's offline Node capsule set stops short of that exact dependency, forcing an avoidable network install before the authoritative CLI can execute.

          What:
          Pin the exact Commander 15.0.0 npm archive and integrity metadata, include it in the generic offline capsule build/provenance/capability inventory, and retain the upstream MIT license text. Extend source safety fixtures and runtime acceptance to require six hydrated packages and exercise the real Commander Command export. Update the builder and runtime documentation to describe the expanded exact-match capsule set without making Commander a global tool or shifting dependency authority away from the target repository.

          Verified:
          Downloaded commander-15.0.0.tgz from the pinned npm registry URL, verified its lockfile SHA-512 integrity, checked package metadata for name/version/MIT license/ESM packaging/Node >=22.12.0 compatibility and absence of runtime dependencies, passed git diff --check, and passed every repository source test script on the final source tree.

          Impact:
          Fix. Existing supported behavior is unchanged; the offline hydration path now covers the exact Commander dependency required by the current ERPI CLI. This is PATCH-level release material for v0.3.1 after qualification and metadata-only promotion.
          EOF
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Push final PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.sha }}'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:fix/commander-node-capsule

      - name: Dispatch permanent runtime acceptance
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(python3 -c 'import json,os; print(json.dumps({"ref":"main","inputs":{"target_ref":os.environ["TARGET_SHA"]}}))')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/accept-runtime.yml/dispatches" \
            -d "$payload"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Require permanent runtime acceptance success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 60); do
            runs="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/accept-runtime.yml/runs?event=workflow_dispatch&per_page=20")"
            run_id="$(RUNS="$runs" STARTED_AT="$STARTED_AT" python3 -c 'import json,os; d=json.loads(os.environ["RUNS"]); xs=[r for r in d["workflow_runs"] if r["created_at"] >= os.environ["STARTED_AT"]]; xs.sort(key=lambda r:r["created_at"]); print(xs[0]["id"] if xs else "")')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'Permanent Accept runtime dispatch was not observed.' >&2
            exit 1
          fi
          echo "Permanent Accept runtime run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"

          for _ in $(seq 1 300); do
            run="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            read -r status conclusion < <(RUN="$run" python3 -c 'import json,os; r=json.loads(os.environ["RUN"]); print(r["status"], r.get("conclusion") or "")')
            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "Permanent Accept runtime concluded: $conclusion" >&2
                exit 1
              fi
              echo 'Permanent Accept runtime passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Permanent Accept runtime did not complete within this qualification job.' >&2
          exit 1
