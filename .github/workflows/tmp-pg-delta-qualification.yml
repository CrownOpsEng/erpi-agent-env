name: tmp-pg-delta qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - versions.env
      - .github/workflows/tmp-pg-delta-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-pg-delta-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify pg-delta runtime capability
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact package, Supabase contract, and PostgreSQL behavior
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          [[ "$BUNDLE_VERSION" == "0.2.0-dev" ]]
          ROOT="$RUNNER_TEMP/pgdelta-qualification"
          NODE_ROOT="$ROOT/node"
          TOOL="$ROOT/tool"
          REPORT="$ROOT/report.txt"
          SOURCE_SHA="$(git rev-parse HEAD)"
          EXPECTED_LOCK_SHA256='b61b7ff9631db90b051a52e87d6d317a303b5a7584db06cc4b351baa1e82f282'
          PG_IMAGE='postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f'
          mkdir -p "$NODE_ROOT" "$TOOL"
          exec > >(tee "$REPORT") 2>&1

          log() { printf '\n===== %s =====\n' "$*"; }
          cleanup() {
            docker rm -f pgdelta-qual >/dev/null 2>&1 || true
          }
          schema_fingerprint() {
            local db="$1"
            docker exec pgdelta-qual pg_dump -U postgres --schema-only --no-owner "$db" \
              | sed -E '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^\\(un)?restrict /d' \
              | sha256sum \
              | awk '{print $1}'
          }
          trap cleanup EXIT

          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"

          log "Exact Supabase CLI 2.114.0 compatibility contract"
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$ROOT/pgdelta_version.go" \
            https://raw.githubusercontent.com/supabase/cli/v2.114.0/apps/cli-go/pkg/config/pgdelta_version.go
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$ROOT/supabase-pgdelta.ts" \
            https://raw.githubusercontent.com/supabase/cli/v2.114.0/apps/cli-go/internal/db/diff/templates/pgdelta.ts
          grep -F 'DefaultPgDeltaNpmVersion = "1.0.0-alpha.33"' "$ROOT/pgdelta_version.go"
          grep -F 'createPlan' "$ROOT/supabase-pgdelta.ts"
          grep -F 'renderPlanFiles' "$ROOT/supabase-pgdelta.ts"
          grep -F 'integrations/supabase' "$ROOT/supabase-pgdelta.ts"
          grep -F 'skipDefaultPrivilegeSubtraction: true' "$ROOT/supabase-pgdelta.ts"
          echo "SUPABASE_2_114_PGDELTA_CONTRACT=pass"

          log "Exact bundled Node 24.19.0"
          NODE_AR="$ROOT/node.tar.xz"
          curl --fail --location --retry 4 --retry-all-errors \
            -o "$NODE_AR" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${NODE_AR}" | sha256sum -c -
          tar -xJf "$NODE_AR" -C "$NODE_ROOT" --strip-components=1
          export PATH="$NODE_ROOT/bin:$PATH"
          [[ "$(node --version)" == "v${NODE_VERSION}" ]]
          echo "NODE=$(node --version) NPM=$(npm --version)"

          log "Resolve and bind one exact runtime-owned lock"
          cat > "$TOOL/package.json" <<'JSON'
          {
            "name": "magnet-agent-env-pg-delta-runtime",
            "private": true,
            "version": "0.0.0",
            "type": "module",
            "dependencies": {
              "@supabase/pg-delta": "1.0.0-alpha.33"
            }
          }
          JSON
          (
            cd "$TOOL"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            actual_lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
            [[ "$actual_lock_sha" == "$EXPECTED_LOCK_SHA256" ]] || {
              echo "Resolved pg-delta lock drifted: $actual_lock_sha != $EXPECTED_LOCK_SHA256" >&2
              exit 1
            }
            node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`unexpected lockfileVersion ${lock.lockfileVersion}`);
          if (lock.packages?.['node_modules/@supabase/pg-delta']?.version !== '1.0.0-alpha.33') {
            throw new Error('pg-delta exact version not locked');
          }
          for (const [path, rec] of Object.entries(lock.packages || {})) {
            if (!path.startsWith('node_modules/')) continue;
            if (!rec.version) throw new Error(`missing version: ${path}`);
            if (!rec.integrity) throw new Error(`missing integrity: ${path}`);
            if (!rec.resolved?.startsWith('https://registry.npmjs.org/')) {
              throw new Error(`non-registry dependency: ${path} -> ${rec.resolved}`);
            }
          }
          console.log(`LOCKED_PACKAGES=${Object.keys(lock.packages || {}).filter(x => x.startsWith('node_modules/')).length}`);
          NODE
            npm ci --ignore-scripts --no-audit --no-fund
            ./node_modules/.bin/pgdelta --help >/dev/null
            node --input-type=module <<'NODE'
          import { createPlan, deserializeCatalog, renderPlanFiles } from '@supabase/pg-delta';
          import { supabase } from '@supabase/pg-delta/integrations/supabase';
          for (const [name, value] of Object.entries({createPlan, deserializeCatalog, renderPlanFiles})) {
            if (typeof value !== 'function') throw new Error(`missing ${name}`);
          }
          if (!supabase || typeof supabase !== 'object') throw new Error('missing Supabase integration');
          console.log('NODE_API_IMPORT=pass');
          NODE
            cp package-lock.json "$ROOT/pg-delta-package-lock.json"
            npm ls --all > "$ROOT/npm-tree.txt"
            rm -rf node_modules
            npm ci --offline --ignore-scripts --no-audit --no-fund
            echo "WARM_CACHE_OFFLINE_REINSTALL=pass"
          )

          log "PostgreSQL 17.10 behavioral fixture"
          docker run -d --rm --name pgdelta-qual \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55439:5432 \
            "$PG_IMAGE" >/dev/null
          for attempt in $(seq 1 90); do
            if docker exec pgdelta-qual pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec pgdelta-qual pg_isready -U postgres >/dev/null

          for db in source_db target_db clone_db destructive_target; do
            docker exec pgdelta-qual createdb -U postgres "$db"
          done

          cat > "$ROOT/source.sql" <<'SQL'
          create schema magnet;
          revoke all on schema magnet from public;

          create table magnet.entities (
            id bigint generated always as identity primary key,
            canonical_name text,
            state text not null default 'candidate',
            created_at timestamptz not null default now(),
            constraint entities_state_check check (state in ('candidate','active'))
          );

          create table magnet.notes (
            id bigint generated always as identity primary key,
            entity_id bigint not null references magnet.entities(id) on delete cascade,
            body text not null,
            created_at timestamptz not null default now()
          );

          create index notes_entity_idx on magnet.notes(entity_id);

          create or replace function magnet.normalized_name(p text)
          returns text
          language sql
          immutable
          strict
          security invoker
          set search_path = ''
          as $$ select lower(btrim(p)) $$;

          revoke execute on function magnet.normalized_name(text) from public;

          create view magnet.entity_names
          with (security_invoker = true)
          as
          select id, magnet.normalized_name(canonical_name) as normalized_name
          from magnet.entities
          where canonical_name is not null;

          alter table magnet.notes enable row level security;
          create policy notes_read on magnet.notes
            for select
            using (entity_id > 0);
          SQL

          cat > "$ROOT/target.sql" <<'SQL'
          create schema magnet;
          revoke all on schema magnet from public;

          create domain magnet.nonempty_text as text
            check (value is null or btrim(value) <> '');

          create table magnet.entities (
            id bigint generated always as identity primary key,
            canonical_name text,
            external_ref magnet.nonempty_text,
            state text not null default 'candidate',
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            display_name text generated always as (upper(canonical_name)) stored,
            constraint entities_state_check check (state in ('candidate','active','archived'))
          );

          create table magnet.notes (
            id bigint generated always as identity primary key,
            entity_id bigint not null references magnet.entities(id) on delete cascade,
            body text not null,
            created_at timestamptz not null default now()
          );

          create index notes_entity_idx on magnet.notes(entity_id);
          create index notes_recent_idx on magnet.notes(created_at)
            where body <> '';

          create or replace function magnet.normalized_name(p text)
          returns text
          language sql
          immutable
          strict
          security invoker
          set search_path = ''
          as $$ select regexp_replace(lower(btrim(p)), '\s+', ' ', 'g') $$;

          revoke execute on function magnet.normalized_name(text) from public;

          create view magnet.entity_names
          with (security_invoker = true)
          as
          select id, magnet.normalized_name(canonical_name) as normalized_name
          from magnet.entities
          where canonical_name is not null;

          alter table magnet.notes enable row level security;
          create policy notes_read on magnet.notes
            for select
            using (entity_id > 0);

          create or replace function magnet.notes_guard()
          returns trigger
          language plpgsql
          set search_path = ''
          as $$
          begin
            if new.body = '' then
              raise exception 'empty note';
            end if;
            return new;
          end
          $$;

          create trigger "notes-guard"
          before insert or update on magnet.notes
          for each row execute function magnet.notes_guard();

          create schema auth;
          create table auth.managed_noise(id bigint primary key);
          SQL

          docker exec -i pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d source_db < "$ROOT/source.sql"
          docker exec -i pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d target_db < "$ROOT/target.sql"
          docker exec -i pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d destructive_target < "$ROOT/source.sql"
          docker exec pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d destructive_target \
            -c 'drop table magnet.notes cascade' >/dev/null

          cat > "$TOOL/qualify.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createPlan, renderPlanFiles } from '@supabase/pg-delta';
          import { supabase } from '@supabase/pg-delta/integrations/supabase';

          const [source, target, outDir] = process.argv.slice(2);
          const result = await createPlan(source, target, {
            ...supabase,
            skipDefaultPrivilegeSubtraction: true,
          });
          const files = result
            ? renderPlanFiles(result.plan, { includeTransactions: false, sqlFormatOptions: { maxWidth: 180, keywordCase: 'upper' } })
            : [];
          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });
          const envelope = files.map((file, index) => {
            fs.writeFileSync(path.join(outDir, file.path), file.sql);
            return {
              order: index + 1,
              name: file.path.replace(/^\d+_/, '').replace(/\.sql$/, ''),
              path: file.path,
              transactionMode: file.unit.transactionMode,
              statements: file.unit.statements.length,
            };
          });
          fs.writeFileSync(path.join(outDir, 'envelope.json'), JSON.stringify({version: 1, files: envelope}, null, 2));
          console.log(JSON.stringify({version: 1, files: envelope}));
          process.exit(0);
          NODE

          source_url='postgresql://postgres@127.0.0.1:55439/source_db'
          target_url='postgresql://postgres@127.0.0.1:55439/target_db'
          clone_url='postgresql://postgres@127.0.0.1:55439/clone_db'
          destructive_url='postgresql://postgres@127.0.0.1:55439/destructive_target'

          timeout 60 node "$TOOL/qualify.mjs" "$source_url" "$target_url" "$ROOT/plan"
          test -s "$ROOT/plan/envelope.json"
          find "$ROOT/plan" -name '*.sql' -type f -print -exec cat {} \; > "$ROOT/plan.sql"
          grep -F 'nonempty_text' "$ROOT/plan.sql"
          grep -F 'updated_at' "$ROOT/plan.sql"
          grep -F 'notes_recent_idx' "$ROOT/plan.sql"
          grep -F 'notes-guard' "$ROOT/plan.sql"
          ! grep -F 'auth.managed_noise' "$ROOT/plan.sql"
          echo "REPRESENTATIVE_PLAN=pass"

          docker exec pgdelta-qual pg_dump -U postgres --schema-only --no-owner source_db \
            | docker exec -i pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d clone_db >/dev/null

          for file in "$ROOT"/plan/*.sql; do
            docker exec -i pgdelta-qual psql -v ON_ERROR_STOP=1 -U postgres -d clone_db < "$file" >/dev/null
          done
          timeout 60 node "$TOOL/qualify.mjs" "$clone_url" "$target_url" "$ROOT/convergence"
          node -e "const e=require('$ROOT/convergence/envelope.json'); if(e.files.length) { console.error(e); process.exit(1) }"
          echo "PLAN_APPLIES_AND_CONVERGES=pass"

          timeout 60 node "$TOOL/qualify.mjs" "$target_url" "$target_url" "$ROOT/empty"
          node -e "const e=require('$ROOT/empty/envelope.json'); if(e.files.length) process.exit(1)"
          echo "IDENTICAL_DATABASE_EMPTY_DIFF=pass"

          timeout 60 node "$TOOL/qualify.mjs" "$source_url" "$destructive_url" "$ROOT/destructive"
          find "$ROOT/destructive" -name '*.sql' -type f -print -exec cat {} \; > "$ROOT/destructive.sql"
          grep -Eiq 'DROP[[:space:]]+(TABLE|VIEW|FUNCTION|INDEX|POLICY|TRIGGER)|DROP[[:space:]]+COLUMN' "$ROOT/destructive.sql"
          echo "DESTRUCTIVE_CHANGE_VISIBLE_IN_PROPOSAL=pass"

          before_source="$(schema_fingerprint source_db)"
          before_target="$(schema_fingerprint target_db)"
          timeout 60 node "$TOOL/qualify.mjs" "$source_url" "$target_url" "$ROOT/read-only-repeat" >/dev/null
          after_source="$(schema_fingerprint source_db)"
          after_target="$(schema_fingerprint target_db)"
          [[ "$before_source" == "$after_source" && "$before_target" == "$after_target" ]]
          echo "PLAN_GENERATION_NON_MUTATING=pass"

          log "Qualification summary"
          printf '%s\n' \
            "SOURCE_SHA=$SOURCE_SHA" \
            "PGDELTA_VERSION=1.0.0-alpha.33" \
            "PGDELTA_LOCK_SHA256=$EXPECTED_LOCK_SHA256" \
            "SUPABASE_CLI_BASELINE=2.114.0" \
            "NODE_API_IMPORT=pass" \
            "WARM_CACHE_OFFLINE_REINSTALL=pass" \
            "REPRESENTATIVE_PLAN=pass" \
            "PLAN_APPLIES_AND_CONVERGES=pass" \
            "IDENTICAL_DATABASE_EMPTY_DIFF=pass" \
            "DESTRUCTIVE_CHANGE_VISIBLE_IN_PROPOSAL=pass" \
            "PLAN_GENERATION_NON_MUTATING=pass" \
            > "$ROOT/summary.txt"
          cat "$ROOT/summary.txt"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-delta-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pgdelta-qualification/report.txt
            ${{ runner.temp }}/pgdelta-qualification/summary.txt
            ${{ runner.temp }}/pgdelta-qualification/pg-delta-package-lock.json
            ${{ runner.temp }}/pgdelta-qualification/npm-tree.txt
            ${{ runner.temp }}/pgdelta-qualification/plan.sql
            ${{ runner.temp }}/pgdelta-qualification/plan/envelope.json
            ${{ runner.temp }}/pgdelta-qualification/destructive.sql
          if-no-files-found: warn
          retention-days: 7
