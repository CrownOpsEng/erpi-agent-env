name: Build distribution

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build, attach, and publish (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-distribution
  cancel-in-progress: false

jobs:
  build:
    name: Linux x86-64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Compute builder download cache key
        id: download-cache
        run: echo "key=$(./scripts/download-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore builder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .download-cache
          key: magnet-agent-env-linux-x64-${{ steps.download-cache.outputs.key }}
          restore-keys: |
            magnet-agent-env-linux-x64-

      - name: Run source validation
        run: ./tests/static-check.sh

      - name: Validate draft release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source ./versions.env
          expected="v${BUNDLE_VERSION}"
          source_sha="$(git rev-parse HEAD)"
          [[ "$RELEASE_TAG" == "$expected" ]] || {
            echo "Release tag $RELEASE_TAG does not match bundle version $expected." >&2
            exit 1
          }

          if ! tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
            echo "Release tag $RELEASE_TAG does not exist as a Git ref." >&2
            exit 1
          fi
          [[ "$tag_sha" == "$source_sha" ]] || {
            echo "Release tag $RELEASE_TAG resolves to $tag_sha, not checked-out source $source_sha." >&2
            exit 1
          }

          is_draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft" | sed -n '1p')"
          [[ "$is_draft" == true ]] || {
            echo "Release $RELEASE_TAG does not exist as a mutable draft." >&2
            exit 1
          }

      - name: Build and accept distribution
        run: ./build.sh

      - name: Write acceptance metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "name=magnet-agent-env-linux-x64-${BUNDLE_VERSION}" >> "$GITHUB_OUTPUT"
          sidecar="$(printf '%s\n' dist/*.tar.gz.sha256)"
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/write-acceptance-metadata.py \
            --sidecar "$sidecar" \
            --output dist/acceptance.json \
            --source-sha "$source_sha" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --release-tag "$RELEASE_TAG"
          cat "$sidecar"
          {
            echo '```json'
            cat dist/acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/acceptance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Reconfirm draft release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft" | sed -n '1p')"
          [[ "$is_draft" == true ]] || {
            echo "Release $RELEASE_TAG stopped being a draft during the build; refusing to alter published assets." >&2
            exit 1
          }

      - name: Attach distribution to draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/acceptance.json --clobber

      - name: Publish accepted release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
