name: Build distribution

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-distribution
  cancel-in-progress: false

jobs:
  build:
    name: Linux x86-64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore builder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .download-cache
          key: magnet-agent-env-linux-x64-${{ hashFiles('versions.env', 'requirements.lock') }}
          restore-keys: |
            magnet-agent-env-linux-x64-

      - name: Run source validation
        run: ./tests/static-check.sh

      - name: Validate release version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          source ./versions.env
          expected="v${BUNDLE_VERSION}"
          [[ "$RELEASE_TAG" == "$expected" ]] || {
            echo "Release tag $RELEASE_TAG does not match bundle version $expected." >&2
            exit 1
          }

      - name: Build and accept distribution
        run: ./build.sh

      - name: Read artifact metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "name=magnet-agent-env-linux-x64-${BUNDLE_VERSION}" >> "$GITHUB_OUTPUT"
          digest="$(cat dist/*.sha256)"
          printf '%s\n' "$digest"
          printf '%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attach distribution to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
