name: tmp-v0.2.0 materialize qualified database assets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v020-promote-qualified-assets.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: tmp-v020-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Materialize exact qualified database payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v020-database-capabilities

      - name: Download successful qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: v020-database-qualification
          path: ${{ runner.temp }}/qualified
          github-token: ${{ github.token }}
          repository: CrownOpsEng/magnet-photos-env
          run-id: 32331662111

      - name: Verify and commit exact payloads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/qualified"
          PG="$ROOT/postgresql-client-17.10-linux-x64-gnu.tar.gz"
          PL="$ROOT/plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz"
          test -f "$PG"
          test -f "$PL"
          test "$(sha256sum "$PG" | awk '{print $1}')" = '3c73fa9228bb4a95473dff4637412e288c3565138d230fca560928a6887bcdac'
          test "$(sha256sum "$PL" | awk '{print $1}')" = 'b74e1d2e5eec41b2a3839ee267c83e277b1e986ffdc2d89cc4bde2fdd51699d1'

          mkdir -p vendor/database
          install -m 0644 "$PG" vendor/database/postgresql-client-17.10-linux-x64-gnu.tar.gz
          install -m 0644 "$PL" vendor/database/plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz

          git add -- \
            vendor/database/postgresql-client-17.10-linux-x64-gnu.tar.gz \
            vendor/database/plpgsql-check-2.8.11-pg17-linux-x64-gnu.tar.gz
          if git diff --cached --quiet; then
            echo 'Qualified payloads already materialized exactly.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'chore(runtime): materialize qualified database payloads' \
            -m 'Why:
The connected publishing surface cannot upload local binary files directly, while the successful qualification run already produced the exact portable database payloads approved for promotion.' \
            -m 'What:
Materialize only the PostgreSQL 17.10 client payload and plpgsql_check 2.8.11 payload from the fixed successful qualification artifact after verifying both approved SHA-256 digests.' \
            -m 'Validation:
The workflow downloads run 32331662111 artifact v020-database-qualification and fails closed unless the payload hashes are 3c73fa9228bb4a95473dff4637412e288c3565138d230fca560928a6887bcdac and b74e1d2e5eec41b2a3839ee267c83e277b1e986ffdc2d89cc4bde2fdd51699d1.'
          git push origin HEAD:agent/v020-database-capabilities
