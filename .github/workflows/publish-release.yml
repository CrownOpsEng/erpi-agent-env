name: Publish release

on:
  workflow_run:
    workflows: ["Accept runtime"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Accepted release/prerelease ref or commit to publish
        required: true
        default: main
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact accepted distribution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve requested target
        id: request
        shell: bash
        env:
          MANUAL_TARGET: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            target_ref="${{ github.event.workflow_run.head_sha }}"
            trigger_run_id="${{ github.event.workflow_run.id }}"
          else
            target_ref="$MANUAL_TARGET"
            trigger_run_id=""
          fi
          printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"
          printf 'trigger_run_id=%s\n' "$trigger_run_id" >> "$GITHUB_OUTPUT"

      - name: Check out accepted target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.request.outputs.target_ref }}

      - name: Decide whether target is a release cut
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          target_sha="$(git rev-parse HEAD)"
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 --first-parent "$target_sha")"
          distance="$(git rev-list --count --first-parent "${base_tag}..${target_sha}")"
          base_version="${base_tag#v}"
          request_version="$(jq -er 'if (keys == ["version"] and (.version | type) == "string") then .version else error("invalid release request") end' .github/release-request.json)"

          if [[ "$PRODUCT_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[1-9][0-9]*)-([1-9][0-9]*)$ ]]; then
            candidate_base="${BASH_REMATCH[1]}"
            [[ "$candidate_base" == "$base_version" ]] || {
              echo "Candidate build $PRODUCT_VERSION is not attached to nearest published prerelease $base_version." >&2
              exit 1
            }
            [[ "$request_version" == "$base_version" ]] || {
              echo "Candidate build $PRODUCT_VERSION must leave release request at $base_version, not $request_version." >&2
              exit 1
            }
            echo "Source $target_sha is candidate build $PRODUCT_VERSION from $base_tag; no release/prerelease will be published."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$request_version" == "$PRODUCT_VERSION" ]] || {
            echo "Release request version $request_version does not match promoted PRODUCT_VERSION $PRODUCT_VERSION." >&2
            exit 1
          }
          if [[ "$PRODUCT_VERSION" == "$base_version" && "$distance" != 0 ]]; then
            echo "Source $target_sha is ordinary development from $base_tag; no release/prerelease will be published."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [[ -n "$parent" ]]; then
            ./scripts/check-commit-range.sh "$parent" "$target_sha"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "version=$PRODUCT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Retrieve and verify exact acceptance evidence
        if: steps.gate.outputs.publish == 'true'
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
          PRODUCT_VERSION: ${{ steps.gate.outputs.version }}
          TRIGGER_RUN_ID: ${{ steps.request.outputs.trigger_run_id }}
        run: |
          set -euo pipefail
          run_id="$TRIGGER_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Accept runtime" and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty')"
          fi
          [[ -n "$run_id" ]] || { echo "No successful Accept runtime run found for $TARGET_SHA." >&2; exit 1; }

          run_record="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r '.name' <<<"$run_record")" == 'Accept runtime' ]] || { echo "Run $run_id is not Accept runtime." >&2; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$run_record")" == "$TARGET_SHA" ]] || { echo "Acceptance run $run_id targets a different SHA." >&2; exit 1; }
          [[ "$(jq -r '.status + ":" + .conclusion' <<<"$run_record")" == 'completed:success' ]] || { echo "Acceptance run $run_id is not successfully completed." >&2; exit 1; }

          rm -rf accepted
          mkdir accepted
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "acceptance-$TARGET_SHA" --dir accepted
          metadata="accepted/acceptance.json"
          [[ -f "$metadata" ]] || { echo 'Acceptance metadata missing from retained artifact.' >&2; exit 1; }
          [[ "$(jq -r '.status' "$metadata")" == accepted ]] || { echo 'Acceptance metadata is not accepted.' >&2; exit 1; }
          [[ "$(jq -r '.source.commit' "$metadata")" == "$TARGET_SHA" ]] || { echo 'Acceptance metadata source SHA mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.product_version' "$metadata")" == "$PRODUCT_VERSION" ]] || { echo 'Acceptance metadata product version mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.workflow.run_id' "$metadata")" == "$run_id" ]] || { echo 'Acceptance metadata run ID mismatch.' >&2; exit 1; }

          archive_name="$(jq -er '.artifact.filename' "$metadata")"
          expected_digest="$(jq -er '.artifact.sha256' "$metadata")"
          archive="accepted/$archive_name"
          sidecar="$archive.sha256"
          [[ -f "$archive" && -f "$sidecar" ]] || { echo 'Retained archive or checksum sidecar missing.' >&2; exit 1; }
          (cd accepted && sha256sum -c "$(basename -- "$sidecar")") >/dev/null
          actual_digest="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$actual_digest" == "$expected_digest" ]] || { echo 'Retained archive digest disagrees with acceptance metadata.' >&2; exit 1; }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable tag and draft release
        if: steps.gate.outputs.publish == 'true'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
          PRODUCT_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${PRODUCT_VERSION}"
          published=false
          if tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq .object.sha 2>/dev/null)"; then
            [[ "$tag_sha" == "$TARGET_SHA" ]] || {
              echo "Immutable tag $release_tag already points to $tag_sha, not accepted target $TARGET_SHA." >&2
              exit 1
            }
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$release_tag" -f "sha=$TARGET_SHA" >/dev/null
          fi

          expected_prerelease=false
          [[ "$PRODUCT_VERSION" == *-* ]] && expected_prerelease=true
          existing="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$release_tag\") | [.draft,.prerelease,.target_commitish] | @tsv" | sed -n '1p')"
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r is_draft is_prerelease release_target <<<"$existing"
            [[ "$is_prerelease" == "$expected_prerelease" ]] || { echo 'Existing Release prerelease flag disagrees with product version.' >&2; exit 1; }
            if [[ "$is_draft" == true ]]; then
              [[ "$release_target" == "$TARGET_SHA" ]] || gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --draft=true >/dev/null
            else
              published=true
            fi
          else
            args=(release create "$release_tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$release_tag" --generate-notes --draft)
            [[ "$expected_prerelease" == true ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Attach exact accepted distribution
        if: steps.gate.outputs.publish == 'true' && steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.evidence.outputs.archive }}
          SIDECAR: ${{ steps.evidence.outputs.sidecar }}
          METADATA: ${{ steps.evidence.outputs.metadata }}
        run: |
          set -euo pipefail
          is_draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft" | sed -n '1p')"
          [[ "$is_draft" == true ]] || { echo "Release $RELEASE_TAG is no longer a draft; refusing to alter immutable assets." >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$SIDECAR" "$METADATA" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
