name: Publish release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Accepted ref/commit to release
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - .github/release-request.json

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Prepare accepted release
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve requested target
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TARGET: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            request_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/contents/.github/release-request.json?ref=$GITHUB_SHA" \
              --jq .content | base64 --decode)"
            target_ref="$(jq -er '.target_sha' <<<"$request_json")"
            requested_version="$(jq -er '.version' <<<"$request_json")"
            [[ "$target_ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'release-request.json target_sha must be an exact 40-character lowercase commit SHA.' >&2
              exit 1
            }
            [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo 'release-request.json version is not a valid release version.' >&2
              exit 1
            }
          else
            target_ref="$MANUAL_TARGET"
            requested_version=''
          fi

          printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"
          printf 'requested_version=%s\n' "$requested_version" >> "$GITHUB_OUTPUT"

      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.request.outputs.target_ref }}

      - name: Verify acceptance and prepare release tag/draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ steps.request.outputs.requested_version }}
        run: |
          set -euo pipefail
          source ./versions.env
          target_sha="$(git rev-parse HEAD)"
          release_tag="v${BUNDLE_VERSION}"

          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$BUNDLE_VERSION" ]]; then
            echo "Release request version $REQUESTED_VERSION does not match target BUNDLE_VERSION $BUNDLE_VERSION." >&2
            exit 1
          fi

          accepted="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target_sha&per_page=100" \
            --jq 'any(.workflow_runs[]; .name == "Accept runtime" and .status == "completed" and .conclusion == "success")')"
          [[ "$accepted" == true ]] || {
            echo "Target $target_sha has no successful completed Accept runtime run." >&2
            echo "Push/accept the intended release commit before publishing it." >&2
            exit 1
          }

          tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq .object.sha 2>/dev/null || true)"
          if [[ -n "$tag_sha" ]]; then
            [[ "$tag_sha" == "$target_sha" ]] || {
              echo "Tag $release_tag already points to $tag_sha, not accepted target $target_sha." >&2
              exit 1
            }
            echo "Release tag $release_tag already points to accepted target $target_sha."
          else
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$release_tag" \
              -f "sha=$target_sha" >/dev/null
            echo "Created release tag $release_tag at accepted target $target_sha."
          fi

          existing="$(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$release_tag\") | [.draft,.target_commitish] | @tsv" | sed -n '1p')"
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r is_draft release_target <<<"$existing"
            [[ "$is_draft" == true ]] || {
              echo "Release $release_tag is already published; refusing to recreate or modify it." >&2
              exit 1
            }
            if [[ "$release_target" != "$target_sha" ]]; then
              gh release edit "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$target_sha" \
                --draft=true >/dev/null
              echo "Realigned draft release $release_tag metadata to accepted target $target_sha."
            fi
            echo "Reusing matching draft release $release_tag."
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$release_tag" \
              --generate-notes \
              --draft
            echo "Prepared draft release $release_tag for $target_sha."
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch release distribution build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run build-dist.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG"
          echo "Dispatched Build distribution for draft $RELEASE_TAG."
