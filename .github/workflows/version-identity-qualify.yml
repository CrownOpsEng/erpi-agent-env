name: Qualify version identity repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out qualification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/version-identity-repair
          fetch-depth: 0

      - name: Apply permanent source transformation
        run: |
          python3 .github/version-identity-promoter-fix.py
          python3 .github/version-identity-promote.py
          chmod 0755 \
            scripts/build-identity.sh \
            tests/build-identity-check.sh \
            tests/version-transition-check.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/release-workflow-check.sh')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          replaced = 0
          for line in lines:
              if 'grep -F' in line and 'archive_name=' in line and 'jq -er' in line:
                  out.append("grep -F \"jq -er '.artifact.filename' dist/acceptance.json\" \"$BUILD\" >/dev/null")
                  out.append("grep -F 'echo \"name=${archive_name%.tar.gz}\"' \"$BUILD\" >/dev/null")
                  replaced += 1
              else:
                  out.append(line)
          if replaced != 1:
              raise SystemExit(f'expected one workflow-name assertion to normalize, found {replaced}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Run complete source policy gate
        run: |
          ./tests/static-check.sh
          ./tests/commit-message-check.sh
          ./tests/commit-range-check.sh
          ./tests/release-workflow-check.sh

      - name: Commit permanent tree locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            README.md CONTRIBUTING.md VALIDATION.md build.sh \
            scripts/build-identity.sh scripts/check-version-transition.py \
            scripts/check-commit-range.sh scripts/write-acceptance-metadata.py \
            templates/RUNTIME-README.md templates/scripts/selftest.sh \
            tests/build-identity-check.sh tests/version-transition-check.sh \
            tests/acceptance-metadata-check.sh tests/commit-range-check.sh \
            tests/static-check.sh tests/release-workflow-check.sh \
            .github/workflows/accept-runtime.yml .github/workflows/build-dist.yml
          git add -u -- \
            .github/version-identity-promote.py \
            .github/version-identity-promoter-fix.py \
            .github/workflows/version-identity-qualify.yml
          git diff --cached --check
          cat > /tmp/commit-message <<'MSG'
          fix(release): separate build identity from lifecycle version

          Why:
          Development archives reused BUNDLE_VERSION as their complete filename identity even though multiple source commits intentionally share one development lifecycle version. That contradicted the repository's own source-identity policy and made different builds indistinguishable by name. The audit also found an arbitrary router byte cap, historical narration in current-state docs, and candidate immutability that was stated more strongly than it was mechanically enforced.

          What:
          Derive development BUILD_ID from lifecycle version plus Git source identity, record full source provenance in the runtime and acceptance metadata, refuse dirty distributable builds, make artifact naming source-bound, and bind workflows to the checked-out SHA. Add executable RC/stable transition checks, remove the arbitrary AGENTS byte cap and release-command duplication test, define the environment's SemVer compatibility surface, and rewrite current-state portability/provenance text neutrally.

          Validation:
          The transformed tree passed the repository static, commit-policy, commit-range, and release-workflow checks before this commit. This qualification workflow next runs the complete build against this clean committed source; exact main-commit Validate and Accept runtime remain required after promotion.
          MSG
          sed -i 's/^          //' /tmp/commit-message
          git commit -F /tmp/commit-message
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build and exercise committed runtime
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          MAGNET_AGENT_SOURCE_COMMIT="$source_sha" ./build.sh --out /tmp/version-identity-dist
          ls -l /tmp/version-identity-dist

      - name: Push qualified permanent tree
        run: git push origin HEAD:agent/version-identity-repair

      - name: Upload qualified development runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-identity-qualified-runtime
          path: |
            /tmp/version-identity-dist/*.tar.gz
            /tmp/version-identity-dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
