name: Replace unused v0.1.1 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-v011.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: replace-unused-v0.1.1
  cancel-in-progress: false

jobs:
  replace:
    name: Replace unused v0.1.1
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v0.1.1
      TARGET_SHA: c25aeb7535152bba1df9c5c85819a0e16d546660
    steps:
      - name: Verify exact accepted target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in 'Validate' 'Accept runtime'; do
            passed="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
              --jq "any(.workflow_runs[]; .name == \"$workflow\" and .status == \"completed\" and .conclusion == \"success\")")"
            [[ "$passed" == true ]] || {
              echo "Target $TARGET_SHA lacks successful $workflow evidence." >&2
              exit 1
            }
          done

      - name: Replace release and tag with accepted source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          fi

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$TARGET_SHA" >/dev/null

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft

          tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$tag_sha" == "$TARGET_SHA" ]] || {
            echo "Replacement tag resolves to $tag_sha, expected $TARGET_SHA." >&2
            exit 1
          }

      - name: Dispatch permanent distribution build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dist.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG"
          echo "Dispatched permanent Build distribution for replacement $RELEASE_TAG at $TARGET_SHA."
