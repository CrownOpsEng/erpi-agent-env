name: Bootstrap v0.1.0 assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v0.1.0-assets.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch v0.1.0 distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Build distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-dist.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=v0.1.0
